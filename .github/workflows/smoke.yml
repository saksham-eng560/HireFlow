# Smoke-tests the public demo (docs/DEPLOY.md): every day, after each dashboard deploy, and on demand.
# It checks https://hireflow-three-woad.vercel.app unless the repository variable DEMO_SITE_URL says otherwise
# (DEMO_API_URL, optional: the API's own URL). The daily visit also keeps a free Hugging Face Space awake
# (they sleep after 48 hours without visitors).
name: Smoke test (public demo)

on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * *"
  workflow_run:
    workflows: ["Deploy dashboard (Vercel)"]
    types: [completed]

permissions:
  contents: read

jobs:
  smoke:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Visit the demo like a visitor would
        env:
          SITE: ${{ vars.DEMO_SITE_URL || 'https://hireflow-three-woad.vercel.app' }}
          API: ${{ vars.DEMO_API_URL }}
        # Free plans sleep when idle, so the first request can take a minute
        run: python scripts/smoke_test.py --site "$SITE" ${API:+--api "$API"} --demo --timeout 120
