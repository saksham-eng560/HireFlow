# Deploys the demo API to a free Hugging Face Space after CI passes on main (docs/DEPLOY.md, "Free deployment").
#
# One-time setup: a Hugging Face account, a token with "write" access (https://huggingface.co/settings/tokens)
# saved as the repository secret HF_TOKEN. Optional repository variables:
#   HF_SPACE      owner/name of the Space (default: <your Hugging Face user>/hireflow)
#   FRONTEND_URL  the dashboard's URL (default: the Vercel project below)
# Without HF_TOKEN the job does nothing.
name: Deploy API (Hugging Face Space)

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-space
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      FRONTEND_URL: ${{ vars.FRONTEND_URL || 'https://hireflow-three-woad.vercel.app' }}
    steps:
      - name: Skip without HF_TOKEN
        if: env.HF_TOKEN == ''
        run: echo "::notice::HF_TOKEN is not set, so the API is not deployed (see docs/DEPLOY.md, Free deployment)."
      - uses: actions/checkout@v4
        if: env.HF_TOKEN != ''
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-python@v5
        if: env.HF_TOKEN != ''
        with:
          python-version: "3.12"
      - name: Deploy
        id: deploy
        if: env.HF_TOKEN != ''
        run: |
          pip install "huggingface_hub>=0.26,<1"
          python scripts/deploy_space.py --frontend-url "$FRONTEND_URL" ${{ vars.HF_SPACE && format('--space {0}', vars.HF_SPACE) || '' }}
      - name: Smoke test
        if: env.HF_TOKEN != ''
        run: python scripts/smoke_test.py --site "$FRONTEND_URL" --api "${{ steps.deploy.outputs.api_url }}" --demo --timeout 120
