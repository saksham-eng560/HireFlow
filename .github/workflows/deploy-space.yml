# Deploys the demo API to a Hugging Face Space, on demand (docs/DEPLOY.md, "On a Hugging Face Space").
# Hugging Face runs Docker Spaces only with a PRO subscription, so this runs only when started by hand
# (Actions > Deploy API (Hugging Face Space) > Run workflow). The free route is Render: render.yaml.
#
# Setup: a Hugging Face PRO account and a token with "write" access (https://huggingface.co/settings/tokens)
# saved as the repository secret HF_TOKEN. Optional repository variables:
#   HF_SPACE      owner/name of the Space (default: <your Hugging Face user>/hireflow)
#   FRONTEND_URL  the dashboard's URL (default: the Vercel project below)
name: Deploy API (Hugging Face Space)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-space
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      FRONTEND_URL: ${{ vars.FRONTEND_URL || 'https://hireflow-three-woad.vercel.app' }}
    steps:
      - name: Skip without HF_TOKEN
        if: env.HF_TOKEN == ''
        run: echo "::notice::HF_TOKEN is not set, so the API is not deployed (see docs/DEPLOY.md, "On a Hugging Face Space")."
      - uses: actions/checkout@v4
        if: env.HF_TOKEN != ''
      - uses: actions/setup-python@v5
        if: env.HF_TOKEN != ''
        with:
          python-version: "3.12"
      - name: Deploy
        id: deploy
        if: env.HF_TOKEN != ''
        run: |
          pip install "huggingface_hub>=0.26,<1"
          python scripts/deploy_space.py --frontend-url "$FRONTEND_URL" ${{ vars.HF_SPACE && format('--space {0}', vars.HF_SPACE) || '' }}
      - name: Smoke test
        if: env.HF_TOKEN != ''
        run: python scripts/smoke_test.py --site "$FRONTEND_URL" --api "${{ steps.deploy.outputs.api_url }}" --demo --timeout 120
