# gitleaks (CI "Security" job): the default rules, minus the placeholder keys tests, CI and docs use.
# These placeholders are never real secrets; real keys only ever live in .env / the hosting dashboards.
title = "HireFlow"

[extend]
useDefault = true

[[allowlists]]
description = "Test fixtures, CI placeholders and the specification's example values"
paths = [
  '''^backend/tests/''',
  '''^PROJECT_SPECIFICATION\.md$''',
]
regexes = [
  '''ci-secret-key-that-is-long-enough-for-hs256-signing''',
  '''test-secret-key-that-is-long-enough-1234567890''',
]
