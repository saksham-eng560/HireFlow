# Render Blueprint: HireFlow's public demo API on Render's free plan (docs/DEPLOY.md, "Free deployment").
# One click: https://render.com/deploy?repo=https://github.com/saksham-eng560/HireFlow
#
# One container, one process (deploy/Dockerfile, the all-in-one role): the API in demo mode with its tasks and
# scheduler in background threads, SQLite and local files, Chromium for form filling. It fits the free 512 MB.
# The free plan sleeps after 15 minutes without visitors and wakes on the next one (about a minute); its disk is
# wiped on every restart, which suits a demo that resets every night anyway.
#
# The always-on setup on paid instances (Neon, Upstash, R2, a separate worker) is deploy/render-always-on.yaml:
# New > Blueprint > this repository > Blueprint path "deploy/render-always-on.yaml".

services:
  - type: web
    name: hireflow-api
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./deploy/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeployTrigger: commit          # redeploy on every push to main
    envVars:
      # The dashboard on Vercel: sign-in cookies and cross-site checks trust only this origin
      - key: FRONTEND_URL
        value: https://hireflow-three-woad.vercel.app
      - key: CORS_ORIGINS
        value: https://hireflow-three-woad.vercel.app
      # Generated once by Render; nothing secret is in git (PUBLIC_API_URL defaults to this service's URL)
      - key: SECRET_KEY
        generateValue: true
      - key: ENCRYPTION_KEY
        generateValue: true
      - key: LOG_LEVEL
        value: INFO
      # Optional, added later in the dashboard (Environment): ANTHROPIC_API_KEY, or Ollama Cloud (docs/OLLAMA.md).
      # Without an AI key the demo runs on built-in heuristics.
